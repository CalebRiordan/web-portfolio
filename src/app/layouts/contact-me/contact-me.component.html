<div class="contact-me-section scroll-offset">
  <div #contactMeCard class="contact-me-card" id="contact-me">
    <div class="heading contact-me-heading">Contact Me</div>
    <div class="inner-card" [ngClass]="{ 'form-processing': formProcessing }">
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <div class="grid-layout">
          <!-- Left side -->
          <div
            class="grid-item grid-item-1"
            [ngClass]="{ 'form-processing': formProcessing }"
          >
            <!-- Name Input -->
            <div class="input-group">
              <div class="field-tag">Name</div>
              <input
                type="text"
                class="field"
                formControlName="name"
                [ngClass]="{
                  'is-invalid': fc['name'].touched && fc['name'].invalid
                }"
              />
              <div
                class="input-invalid"
                [hidden]="!(fc['name'].errors?.['required'] && fc['name'].touched)"
              >
                Your name is required
              </div>
            </div>

            <!-- Email Input -->
            <div class="input-group">
              <div class="field-tag email-field">Email</div>
              <input
                type="email"
                class="field"
                formControlName="email"
                [ngClass]="{
                  'is-invalid': fc['email'].touched && fc['email'].invalid
                }"
              />
              <div
                class="input-invalid"
                [hidden]="!((fc['email'].errors?.['required'] || fc['email'].errors?.['email']) && fc['email'].touched)"
              >
                {{ fc['email'].errors?.['required'] ? "Your email is required" : "Invalid email format" }}
              </div>
            </div>
          </div>

          <!-- Right Side -->
          <div class="grid-item grid-item-2 contact-details">
            <div>Caleb Andrew Riordan</div>
            <div>Western Cape<br />South Africa</div>
            <div>Cell: +27 084 656 3352<br />caleb2003riordan&#64;gmail.com</div>
          </div>

          <!-- Bottom -->
          <div
            class="grid-item grid-item-3"
            [ngClass]="{ 'form-processing': formProcessing }"
          >
            <div class="input-group">
              <div class="field-tag message-field">Message</div>
              <textarea
                class="field"
                formControlName="message"
                [ngClass]="{
                  'is-invalid': fc['message'].touched && fc['message'].invalid
                }"
              ></textarea>
              <div
                class="input-invalid"
                [hidden]="!(fc['message'].errors?.['required'] && fc['message'].touched)"
              >
                A message is required
              </div>
            </div>
          </div>
        </div>

        <button
          class="button"
          [disabled]="contactForm.invalid || formProcessing || onCooldown"
          appRippleEffect
        >
          Submit
        </button>
      </form>
    </div>
  </div>
</div>
